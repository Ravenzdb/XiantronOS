<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XiantronOS — Transcendence</title>
<script defer src="https://cdn.vercel-insights.com/v1/script.js"></script><link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400&family=JetBrains+Mono:wght@300&display=swap" rel="stylesheet">
<style>
:root{--bg:#05040a;--gold:#e8c76a;--violet:#8a7fcf}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg);color:#F5F5F5;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.screen{position:fixed;inset:0;z-index:10;display:none;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;opacity:0;transition:opacity.8s}
.screen.active{display:flex;opacity:1}
button{border:1px solid rgba(212,175,90,.4);color:var(--gold);background:transparent;padding:14px 36px;border-radius:40px;letter-spacing:.22em;font-size:11px;cursor:pointer;font-family:'JetBrains Mono',monospace}
.card{background:rgba(15,13,30,.6);border:1px solid rgba(212,175,90,.15);border-radius:16px;padding:22px;backdrop-filter:blur(12px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="welcome" class="screen active" style="background:#05040a;z-index:100">
<div style="text-align:center">
<div style="font-size:11px;letter-spacing:.45em;color:rgba(212,175,90,.65);margin-bottom:8px">XIANTRONOS</div>
<div style="font-size:8px;letter-spacing:.3em;color:rgba(138,127,207,.55);margin-bottom:28px;border:1px solid rgba(138,127,207,.18);padding:5px 12px;border-radius:20px;display:inline-block">V3 • RAVEN PROTOCOL • ACTIVE WORLDWIDE</div>
<h1 style="font-size:clamp(1.8rem,5vw,2.8rem);font-weight:300;letter-spacing:.18em;margin-bottom:18px;font-family:Cinzel,serif">TRANSCENDENCE</h1>
<p style="font-size:14px;color:rgba(255,255,255,.45);margin-bottom:48px">Privacy by Design</p>
<button id="enter-btn">ENTER</button>
</div>
</div>
<div id="home" class="screen">
<div style="text-align:center"><h2 style="font-family:Cinzel;font-weight:300;letter-spacing:.2em;margin-bottom:20px">THE RAVEN HAS SEEN YOU</h2><p style="color:rgba(255,255,255,.5);margin-bottom:30px">Gold and violet melting — transformation initiated</p><button onclick="document.getElementById('home').style.display='none';document.getElementById('observe').classList.add('active');document.getElementById('observe').style.display='flex'">CONTINUE →</button></div>
</div>
<div id="observe" class="screen"><div style="text-align:center"><h1 style="font-family:Cinzel;font-weight:300">Welcome home, Initiated.</h1><p style="margin:20px 0;color:rgba(255,255,255,.5)">XiantronOS Transcendence is live.</p><a href="https://xiantron-os-beta.vercel.app" style="color:var(--gold)">Reload</a></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const canvas=document.getElementById('c');let W=innerWidth,H=innerHeight,scene,camera,renderer,points,geo,count;
function init(){scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(58,W/H,0.1,1000);camera.position.z=42;renderer=new THREE.WebGLRenderer({canvas,antialias:false,alpha:true});renderer.setSize(W,H);renderer.setPixelRatio(Math.min(devicePixelRatio,2));count=W<700?900:1800;const pos=new Float32Array(count*3),col=new Float32Array(count*3),base=new Float32Array(count*3);const c1=new THREE.Color(0xd4af5a),c2=new THREE.Color(0x8a7fcf),c3=new THREE.Color(0xf0d88a);for(let i=0;i<count;i++){const i3=i*3,r=15+Math.random()*26,th=Math.random()*Math.PI*2,ph=Math.acos(2*Math.random()-1);pos[i3]=base[i3]=r*Math.sin(ph)*Math.cos(th);pos[i3+1]=base[i3+1]=r*Math.sin(ph)*Math.sin(th);pos[i3+2]=base[i3+2]=r*Math.cos(ph)*0.55;const t=Math.random();let cc=t<0.5?c1.clone().lerp(c2,t*2):c2.clone().lerp(c3,(t-0.5)*2);col[i3]=cc.r;col[i3+1]=cc.g;col[i3+2]=cc.b;}geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));const mat=new THREE.PointsMaterial({size:0.13,vertexColors:true,transparent:true,opacity:0.78,blending:THREE.AdditiveBlending,depthWrite:false});points=new THREE.Points(geo,mat);scene.add(points);}
let mx=0,my=0,tmx=0,tmy=0;window.addEventListener('mousemove',e=>{tmx=(e.clientX/W)*2-1;tmy=-(e.clientY/H)*2+1});
function anim(){requestAnimationFrame(anim);mx+=(tmx-mx)*0.05;my+=(tmy-my)*0.05;const t=performance.now()*0.001;const p=geo.attributes.position.array;for(let i=0;i<count;i++){const i3=i*3;p[i3+2]=Math.sin(t*0.13+i*0.25)*0.35;}geo.attributes.position.needsUpdate=true;camera.position.x=mx*1.4;camera.position.y=my*1.0;camera.lookAt(0,0,0);renderer.render(scene,camera);}
init();anim();
document.getElementById('enter-btn').addEventListener('click',()=>{document.getElementById('welcome').style.display='none';document.getElementById('home').classList.add('active');document.getElementById('home').style.display='flex';});
window.addEventListener('resize',()=>{W=innerWidth;H=innerHeight;camera.aspect=W/H;camera.updateProjectionMatrix();renderer.setSize(W,H)});
</script>
</body>
</html>
